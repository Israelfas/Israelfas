<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Generando actividad"><title>Generando actividad</title><style>@font-face{font-family:BG;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.blink{animation:blink 1.05s steps(1) infinite}
</style><rect x=".5" y=".5" width="1199" height="199" rx="20" fill="#FFFFFF" stroke="#E9E5F5"/>
