<svg xmlns="http://www.w3.org/2000/svg" width="800" height="72" viewBox="0 0 800 72" role="img" aria-label="Stack"><title>Stack</title><style>@font-face{font-family:JB;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:BG;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
